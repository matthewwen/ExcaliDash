services:
  backend:
    image: zimengxiong/excalidash-backend:latest
    container_name: excalidash-backend
    # Run an init process (PID 1) that reaps zombies and forwards SIGTERM/SIGINT
    # to node so graceful shutdown (io.close / prisma.$disconnect) actually runs.
    init: true
    environment:
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=${AUTH_MODE:-local}
      # Set to 1 when the host Nginx proxy is the trusted hop.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - FRONTEND_URL=${FRONTEND_URL:-}
      # Optional for single-instance deployments:
      # if unset, backend auto-generates and persists one in the volume.
      # Recommended to set explicitly for portability and multi-instance setups.
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      # OIDC settings (required for AUTH_MODE=hybrid or oidc_enforced).
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-OIDC}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_EMAIL_CLAIM=${OIDC_EMAIL_CLAIM:-email}
      - OIDC_EMAIL_VERIFIED_CLAIM=${OIDC_EMAIL_VERIFIED_CLAIM:-email_verified}
      - OIDC_ALLOWED_EMAILS=${OIDC_ALLOWED_EMAILS:-}
      - OIDC_REQUIRE_EMAIL_VERIFIED=${OIDC_REQUIRE_EMAIL_VERIFIED:-true}
      - OIDC_JIT_PROVISIONING=${OIDC_JIT_PROVISIONING:-true}
      - OIDC_FIRST_USER_ADMIN=${OIDC_FIRST_USER_ADMIN:-true}
      # Optional scheduled SQLite backups (see docs/DEPLOYMENT.md > Backups).
      # BACKUP_SCHEDULE is a 5- or 6-field cron expression; unset disables it.
      # Uncomment these together with the backup-data volume mount below.
      # - BACKUP_SCHEDULE=0 0 4 * * *
      # - BACKUP_DIR=/app/backups
      # - BACKUP_RETENTION_DAYS=14
    volumes:
      - backend-data:/app/prisma
      # Persist scheduled backups outside the container (pairs with BACKUP_DIR).
      # - backup-data:/app/backups
    ports:
      # Host Nginx proxies API and Socket.IO traffic to this loopback-only port.
      - "127.0.0.1:8000:8000"
    networks:
      - excalidash-network
    restart: unless-stopped
    healthcheck:
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: zimengxiong/excalidash-frontend:latest
    container_name: excalidash-frontend
    ports:
      - "6767:80"
    depends_on:
      - backend
    networks:
      - excalidash-network
    restart: unless-stopped
    healthcheck:
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  excalidash-network:
    driver: bridge

volumes:
  backend-data:
  # Uncomment to persist scheduled backups (see the backend service above).
  # backup-data:
